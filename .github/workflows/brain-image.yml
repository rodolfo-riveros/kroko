# Construye la imagen Docker del cerebro y la publica en GitHub Container Registry (ghcr.io).
# En el servidor, Watchtower la baja y reinicia el cerebro solo (deploy/docker-compose.yml).
name: Imagen del cerebro

on:
  push:
    branches: [main]
    paths:
      - "src/Kroko.Brain/**"
      - "src/Kroko.Shared/**"
      - "deploy/Dockerfile"
      - ".github/workflows/brain-image.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kroko-brain
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      # amd64 (la mayoría de VPS) y arm64 (Oracle Cloud Always Free, Raspberry Pi)
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
