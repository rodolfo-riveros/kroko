# Revisa cada cambio buscando claves o tokens que se hayan colado (Gitleaks).
# Si encuentra uno, la revisión falla: cambia esa clave en su servicio y quítala del repo.
name: Buscar claves filtradas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
